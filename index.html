<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control - Login</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>

   <header>
        <img src="assets/images/logo.png" alt="Logo do Sistema Smart Control" class="logo">
        <h1>Bem-Vindo de volta!</h1>
    </header>
    
     <header>
        <h2>Faça login para acessar sua conta</h2>
    </header>

    <main>
        <section>
            <form action="dashboard.html" method="get">
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required autocomplete="username">
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required autocomplete="current-password">
                </div>

                <button type="submit">Login</button>

                
                <div><a href="cadastro.html">Cadastrar-se</a></div>
                
               <div> <p><a href="https://pedrotech.com.br/pedrolandia/" target="_blank"> Portal Pedro Landia</a></p>
</div>
                
               
            </form>
        </section>
    </main>
    <p>© 2026 Smart Control</p>

</body>
</html>
