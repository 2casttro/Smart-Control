<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Smart Control</title>
</head>
<body>

    <header>
        <img src="assets/images/logo-smart-control.png" alt="Logo do Sistema Smart Control">
        <h1>Cadastro de Usuário - Smart Control</h1>
    </header>

    <main>
        <h2>Formulário de Registro</h2>

        <form action="#" method="post">

            <div>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required minlength="8">
            </div>

            <div>
                <label for="email">E-mail Corporativo:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required minlength="8">
            </div>

            <div>
                <label for="nivel">Nível de Acesso:</label>
                <select id="nivel" name="nivel" required>
                    <option value="">Selecione uma opção</option>
                    <option value="usuario">Usuário</option>
                    <option value="gestor">Gestor</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <div>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Aceito os Termos de Uso</label>
            </div>

            <button type="submit">Concluir Cadastro</button>
        </form>

        <p><a href="login.html">Voltar ao Login</a></p>
    </main>

    <footer>
        <h3>Localização da Sede</h3>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3675.9566430685377!2d-43.93487262389488!3d-19.91912014030426!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!1s0xa69cecd1877b41%3A0x5b40f4c52c90c09!5e0!3m2!1spt-BR!2sbr!4v1722790000000!5m2!1spt-BR!2sbr"
            width="600" 
            height="300"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Mapa da sede da empresa Smart Control">
        </iframe>
        <p>© 2026 Smart Control</p>
    </footer>

</body>
</html>
