<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Smart Control</title>
</head>
<body>

    <header>
        <img src="assets/images/logo.jfif" alt="Logo do Sistema Smart Control">
        <h1>Cadastro de Usuário - Smart Control</h1>
    </header>

    <main>
        <h2>Formulário de Registro</h2>

        <form action="#" method="post">

            <div>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required minlength="8">
            </div>

            <div>
                <label for="email">E-mail Corporativo:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required minlength="8">
            </div>


            <div>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Aceito os Termos de Uso</label>
            </div>

            <button type="submit">Concluir Cadastro</button>
        </form>

        <p><a href="file:///C:/xampp/htdocs/2castro/index.html">Voltar ao Login</a></p>
    </main>

    <footer>
        <h3>Localização da Sede</h3>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3923.8468372355137!2d-36.54059302488998!3d-10.4337262139687!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x989c9f63ece95b%3A0x3967e66f71a549c9!2sAv.%20Bar%C3%A3o%20do%20Rio%20Branco!5e0!3m2!1spt-BR!2sbr!4v1785869079326!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <p>© 2026 Smart Control</p>
    </footer>

</body>
</html>
