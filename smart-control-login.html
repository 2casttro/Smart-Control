<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control - Login</title>

</head>
<body>
    <main class="container-login">
        
        <header>
           
            <h1 class="titulo-projeto">Smart Control</h1>
        </header>

        
        <section>
            <h2 class="bem-vindo">Bem-vindo de volta!</h2>
            <p class="subtitulo">Faça login para acessar sua conta</p>

            <form action="#" method="post">
                
                <div class="grupo-campo">
                    <label for="email">Usuário</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu usuário" required autocomplete="username">
                </div>

                
                <div class="grupo-campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>

                
                <div class="grupo-opcoes">
                    <label class="lembrar-me">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#" class="esqueci-senha">Esqueci minha senha</a>
                </div>

                
                <button type="submit" class="botao-entrar">Entrar</button>
            </form>
        </section>

        
        <footer class="rodape">
            &copy;2026 Smart Control. Direitos reservados.
        </footer>
    </main>
</body>
</html>
